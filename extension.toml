# Codex CLI: a harness agents run on (kind `harness`; James, thread 10399 [10869]). `pm add codex` installs it on
# every node that has none, from OpenAI's release on GitHub; one a person installed stays theirs. [harness] v2
# (AGC-17) describes the node's built-in Codex, which must agree with it.
# Format: docs/dev/extensions.md.

[extension]
id = "codex"
name = "Codex CLI"
version = "0.3.0"
node = ">=0.6,<1"
publisher = "aurelio"
summary = "OpenAI's coding agent: agents spawned as codex run on it."

[harness]
npm = "@openai/codex"                       # where its newest version is said
binaries = ["codex"]
protocol = "codex-exec"                     # exec --json
home_env = "CODEX_HOME"                     # each agent's own home
api_keys = ["OPENAI_API_KEY", "CODEX_API_KEY"]   # never passed to a run: runs are on its own login

[harness.install]
from = "release"                            # checked against GitHub's sha-256
repo = "openai/codex"
asset = "codex-{triple}.tar.gz"

[harness.sign_in]
how = "codex login"
check = ["login", "status"]

[harness.mcp]
via = "config-file"                         # its servers in config.toml, in each agent's home
file = "config.toml"
key = "mcp_servers"
rename = { headers = "http_headers" }
drop = ["type"]
